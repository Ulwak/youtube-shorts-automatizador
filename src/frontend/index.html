<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Automatizador De Shorts De Youtube</title>
</head>
<body>
    <div class="contenido">
        <h1>Automatizador De Shorts De Youtube</h1>
        <h2 id="test_flask">Ingrese los datos para ensamblar su short</h2>
        <table id="tabla">
            <thead>
                <tr>
                    <th id="encabezado_tabla">Opcion</th>
                    <th id="encabezado_tabla">Si/Yes</th>
                    <th id="encabezado_tabla">No</th>
                </tr>
                <tr>
                    <td>Realizar backup de la DB si es necesario:</td>
                    <td><input type="radio" id="opcion_respaldo_db_" name="opcion_respaldo_db" value="si"></td>
                    <td><input type="radio" id="opcion_respaldo_db" name="opcion_respaldo_db" value="no"></td>
                </tr>
                <tr>
                    <td>Reutilizar memes si hace falta</td>
                    <td><input type="radio" name="opcion_reutilizar_memes" value="si"></td>
                    <td><input type="radio" name="opcion_reutilizar_memes" value="no"></td>
                </tr>
            </thead>
        </table>
        <input type="number" id="cantidad_shorts" placeholder="Cantidad de shorts a crear (Ej: 1)">
        <button id="crear_short" type="button" onclick="enviar_y_recibir_datos()">Crear Short</button>
        <h3 id="encabezado_puntitos"></h3>
    </div>
    <script src="scripts/script.js"></script>
</body>
</html>
